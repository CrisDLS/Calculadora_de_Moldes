<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor 3D — Globo Trompo Estrella</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      background: #121214;
      color: #e0e0e0;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    #ui-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 280px;
      background: rgba(26, 26, 32, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      font-size: 13px;
    }
    .ui-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #ffffff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .ui-group {
      margin-bottom: 14px;
    }
    .ui-label {
      font-size: 12px;
      color: #a0a0ab;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .ui-slider {
      width: 100%;
      accent-color: #6366f1;
      cursor: pointer;
    }
    .ui-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .ui-btn {
      flex: 1;
      padding: 6px 10px;
      background: #2a2a36;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      color: #e0e0e0;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s ease;
    }
    .ui-btn:hover {
      background: #3a3a4c;
      border-color: rgba(255, 255, 255, 0.3);
    }
    .ui-btn.active {
      background: #4f46e5;
      border-color: #6366f1;
      color: #ffffff;
    }
    #status-badge {
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
    }
    #info-card {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(26, 26, 32, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: #a0a0ab;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <div id="ui-panel">
    <div class="ui-title">
      <span>Trompo Estrella 3D</span>
      <span id="status-badge">Conectado</span>
    </div>

    <div class="ui-group">
      <div class="ui-label"><span>Ambiente</span></div>
      <div class="ui-row">
        <button id="btn-dia" class="ui-btn">Día</button>
        <button id="btn-noche" class="ui-btn active">Noche</button>
      </div>
    </div>

    <div class="ui-group">
      <div class="ui-label">
        <span>Luz de Llama interior</span>
        <span id="val-llama">1.5</span>
      </div>
      <input type="range" id="slider-llama" class="ui-slider" min="0" max="3" step="0.1" value="1.5">
    </div>

    <div class="ui-group">
      <div class="ui-label">
        <span>Luz Solar / Ambiente</span>
        <span id="val-sol">0.4</span>
      </div>
      <input type="range" id="slider-sol" class="ui-slider" min="0" max="2" step="0.1" value="0.4">
    </div>

    <div class="ui-group">
      <div class="ui-label"><span>Visualización</span></div>
      <div class="ui-row">
        <button id="btn-wireframe" class="ui-btn">Aristas</button>
        <button id="btn-reset" class="ui-btn">Centrar</button>
      </div>
    </div>
  </div>

  <div id="info-card">
    <div id="txt-dimensiones">Cargando dimensiones...</div>
    <div>Arrastra para rotar · Rueda para zoom · Clic derecho para desplazar</div>
  </div>

  <script src="/vendor/three.min.js"></script>
  <script src="/vendor/OrbitControls.js"></script>
  <script src="/visor.js"></script>
</body>
</html>
